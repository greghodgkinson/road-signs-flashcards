app = "roadsigns-quiz"       # run `fly apps create` to reserve this name, or change it
primary_region = "lhr"       # change to your nearest region (e.g. ord, iad, syd, fra)

[build]
  [build.args]
    # These are passed at deploy time — see README deploy command below.
    # They are Supabase public keys (safe to use as build args).
    VITE_SUPABASE_URL      = ""
    VITE_SUPABASE_ANON_KEY = ""

[http_service]
  internal_port       = 8080
  force_https         = true
  auto_stop_machines  = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type       = "connections"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory   = "256mb"
  cpu_kind = "shared"
  cpus     = 1
