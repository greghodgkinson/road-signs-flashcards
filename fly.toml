app = "roadsigns-quiz"   # update to your app name, or run: fly apps create
primary_region = "lhr"  # change to nearest region: ord, iad, syd, fra, nrt …

[http_service]
  internal_port        = 8080
  force_https          = true
  auto_stop_machines   = "stop"
  auto_start_machines  = true
  min_machines_running = 0

  [http_service.concurrency]
    type       = "connections"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory   = "256mb"
  cpu_kind = "shared"
  cpus     = 1

# Persistent volume keeps scores.db across deploys and restarts.
# Create it once with: fly volumes create scores_data --size 1
[mounts]
  source      = "scores_data"
  destination = "/data"
